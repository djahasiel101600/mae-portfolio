<!doctype html>
<html lang="en">

<head>

    />

  <!-- Primary Meta Tags (will be enhanced by react-helmet-async) -->
  <title>Mae Busano | Virtual Assistant Portfolio</title>

  <link rel="canonical" href="https://maebusano.com/" />
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://maebusano.com/" />

  <meta property="og:site_name" content="Mae Busano Portfolio" />
