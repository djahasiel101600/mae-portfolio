<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#faf8f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5e6e0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-gradient)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="150" fill="#7c3aed" opacity="0.1"/>
  <circle cx="1100" cy="530" r="200" fill="#ec4899" opacity="0.1"/>
  
  <!-- Avatar circle placeholder -->
  <circle cx="600" cy="200" r="80" fill="#7c3aed" opacity="0.2"/>
  <text x="600" y="215" font-family="Georgia, serif" font-size="48" fill="#7c3aed" text-anchor="middle" font-weight="bold">MB</text>
  
  <!-- Name -->
  <text x="600" y="340" font-family="Georgia, serif" font-size="64" fill="#7c3aed" text-anchor="middle" font-weight="bold">Mae Busano</text>
  
  <!-- Title -->
  <text x="600" y="400" font-family="Inter, Arial, sans-serif" font-size="28" fill="#374151" text-anchor="middle">Virtual Assistant | Administrative &amp; Data Support Specialist</text>
  
  <!-- Description -->
  <text x="600" y="470" font-family="Inter, Arial, sans-serif" font-size="20" fill="#6b7280" text-anchor="middle">Professional Virtual Assistant specializing in</text>
  <text x="600" y="500" font-family="Inter, Arial, sans-serif" font-size="20" fill="#6b7280" text-anchor="middle">administrative support, data management, and remote office assistance</text>
  
  <!-- Website URL -->
  <text x="600" y="580" font-family="Inter, Arial, sans-serif" font-size="18" fill="#7c3aed" text-anchor="middle">maebusano.com</text>
</svg>
